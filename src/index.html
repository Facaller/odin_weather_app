<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <div class="container">
        <div class="weather-data-box">
            <div class="text-data-box">
                <h3>Partly Cloudy</h3>
                <h2>Cape Town, South Africa</h2>
            </div>
            <div class="numerical-data-box">
                <div class="degrees-box">
                    <h1>69</h1>
                </div>
                <div class="humidity-box">
                    <p>Feels like: 69</p>
                    <p>Wind: 6km</p>
                    <p>Humidity: 17%</p>
                </div>
            </div>
        </div>
        <div class="form-container">
            <form action="">
                <div>
                    <label for="search"></label>
                    <input type="text" name="search" id="search">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
