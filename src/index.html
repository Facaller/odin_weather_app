<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <div class="container">
        <div class="weather-data-box">
            <div class="text-data-box">
                <h3 id="conditionsValue">Partly Cloudy</h3>
                <h2 id="locationValue">Cape Town, South Africa</h2>
            </div>
            <div class="numerical-data-box">
                <div class="degrees-box">
                    <h1 id="tempValue" class="temperature">69</h1>
                </div>
                <div class="humidity-box">
                    <p>Feels like: <span id="feelsLikeValue" class="feels-like">69</span></p>
                    <p>Wind: <span id="windValue">6km</span></p>
                    <p>Humidity: <span id="humidityValue">17%</span></p>
                </div>
            </div>
        </div>
        <div class="form-container">
            <form action="">
                <div>
                    <label for="search"></label>
                    <input type="text" name="search" id="search" placeholder="Search city">
                    <div class="error-box hidden">
                        <!-- change this to use rest api -->
                        <p class="error-text">Location not found</p>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
