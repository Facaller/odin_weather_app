<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <img class="video" autoplay muted loop></img>
    <div class="container">
        <div class="weather-data-box">
            <div class="text-data-box">
                <h3 id="conditionsValue">Cloudy with a chance of employment</h3>
                <h2 id="locationValue">Cape Town, South Africa</h2>
            </div>
            <div class="numerical-data-box">
                <div class="degrees-box">
                    <h1 id="tempValue" class="temperature">N/A</h1>
                    <span class="temp-unit"></span>
                </div>
                <div class="humidity-box">
                    <div class="feelslike-box">
                        <p class="feelslike-para">Feels like: 
                            <span id="feelsLikeValue" class="feels-like">N/A</span>
                            <span class="feelslike-unit"></span>
                        </p>
                    </div>
                    <p>Wind: <span id="windValue">N/A</span></p>
                    <p>Humidity: <span id="humidityValue">N/A</span></p>
                </div>
            </div>
        </div>
        <div class="form-container">
            <div class="unit-box" data-unitbox="Search first to enable">
                <button id="metricBtn" class="metric">C</button>
                <button id="imperialBtn" class="imperial">F</button>
            </div>
            <div>
                <form id="searchForm" action="">
                    <label for="search"></label>
                    <input type="text" name="search" id="search" placeholder="Search city">
                    <div class="error-box hidden">
                        <p class="error-text">Location not found</p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
